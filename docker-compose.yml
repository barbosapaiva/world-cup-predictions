services:
  api:
    build: .
    container_name: worldcup-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: worldcup-db
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worldcup} -d ${POSTGRES_DB:-worldcup_predictions}"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    container_name: worldcup-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  jupyter:
    image: jupyter/minimal-notebook:latest
    container_name: worldcup-jupyter
    profiles:
      - dev
    env_file: .env
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./scripts:/home/jovyan/scripts
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "pip install requests pandas python-dotenv asyncpg sqlalchemy &&
      start-notebook.py --NotebookApp.token='' --NotebookApp.password=''"

volumes:
  pgdata: