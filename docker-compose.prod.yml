services:
  nginx:
    image: nginx:alpine
    container_name: worldcup-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - frontend

  certbot:
    image: certbot/certbot
    container_name: worldcup-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  api:
    build: .
    container_name: worldcup-api
    restart: always
    env_file: .env.prod
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: worldcup-frontend
    restart: always
    expose:
      - "80"

  db:
    image: postgres:16-alpine
    container_name: worldcup-db
    restart: always
    env_file: .env.prod
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worldcup} -d ${POSTGRES_DB:-worldcup_predictions}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
